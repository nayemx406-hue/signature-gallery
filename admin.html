<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #222, #050505);
            color: #fff;
        }

        header {
            background: linear-gradient(135deg,#111,#1c1c1c);
            color: #d4af37;
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #d4af37;
            box-shadow: 0 5px 25px rgba(212,175,55,.2);
        }

        header h1 {
            margin: 0;
        }

        .admin {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .admin-order {
            background: linear-gradient(145deg,#111,#1b1b1b);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
            border: 1px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
        }

        .admin-order h3 {
            margin-top: 0;
        }

        .status {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            background: #222;
            color: #fff;
            border: 1px solid #d4af37;
        }

        .status-delivered {
            background: #0f5132;
            color: #75ffb0;
        }

        .status-cancelled {
            background: #5a1111;
            color: #ff8a8a;
        }

        .status-confirmed {
            background: #102a56;
            color: #8fc7ff;
        }

        .status-shipped {
            background: #3b245c;
            color: #d7a8ff;
        }

        .status-pending {
            background: #5c4800;
            color: #ffe477;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }
    
.menu-bar{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    padding:20px;
    background:#0b0b0b;
    border-bottom:1px solid #d4af37;
}

.menu-bar button{
    padding:12px 20px;
    border-radius:25px;
    border:1px solid #d4af37;
    background:linear-gradient(135deg,#111,#222);
    color:#fff;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
}

.menu-bar button:hover{
    background:#d4af37;
    color:#111;
    transform:translateY(-3px);
    box-shadow:0 5px 20px rgba(212,175,55,.4);
}

</style>
</head>

<body>

<header>
    <h1>Shop Admin Dashboard</h1>
</header>

<nav class="menu-bar">
    <button onclick="loadOrders()">🏠 Dashboard</button>
    <button onclick="loadByStatus('Pending')">⏳ Pending</button>
    <button onclick="loadByStatus('Confirmed')">✅ Confirmed</button>
    <button onclick="loadByStatus('Shipped')">📦 Shipped</button>
    <button onclick="loadByStatus('Delivered')">🚚 Delivered</button>
    <button onclick="loadByStatus('Cancelled')">❌ Cancelled</button>
</nav>

<section class="admin">
    <h2>Order List</h2>

    <div id="orders">
        <div class="loading">Loading orders...</div>
    </div>
</section>

<script>
async function loadOrders() {
    const container = document.getElementById("orders");

    try {
        const response = await fetch("/api/orders");

        if (!response.ok) {
            throw new Error("Failed to load orders");
        }

        let orders = await response.json();


        if (orders.length === 0) {
            container.innerHTML = "<p>No orders yet.</p>";
            return;
        }

        container.innerHTML = "";

        orders.forEach(order => {
            container.innerHTML += `
                <div class="admin-order">

                    <h3>Order #${order.order_id}</h3>

                    <p>
                        <strong>Customer:</strong>
                        ${order.customer_name}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${order.phone}
                    </p>

                    <p>
                        <strong>District:</strong>
                        ${order.district}
                    </p>

                    <p>
                        <strong>Address:</strong>
                        ${order.address}
                    </p>

                    <p>
                        <strong>Delivery:</strong>
                        ${order.delivery_type === "inside"
                            ? "Inside Sylhet"
                            : "Outside Sylhet"}
                    </p>

                    <p>
                        <strong>Subtotal:</strong>
                        ৳ ${Number(order.subtotal).toLocaleString()}
                    </p>

                    <p>
                        <strong>Delivery Charge:</strong>
                        ৳ ${Number(order.delivery_charge).toLocaleString()}
                    </p>

                    <p>
                        <strong>Total:</strong>
                        ৳ ${Number(order.total).toLocaleString()}
                    </p>

                    <p>
                        <strong>Payment Method:</strong>
                        ${order.payment_method || "Cash on Delivery"}
                    </p>

                    <p>
                        <strong>bKash Number:</strong>
                        ${order.payment_number || "-"}
                    </p>

                    <p>
                        <strong>Transaction ID:</strong>
                        ${order.transaction_id || "-"}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        <span class="status status-${order.status.toLowerCase()}">${order.status}</span>

                        <br><br>
                        <button onclick="updateStatus('${order.order_id}','Confirmed')">Confirm</button>
                        <button onclick="updateStatus('${order.order_id}','Shipped')">Ship</button>
                        <button onclick="updateStatus('${order.order_id}','Delivered')">Deliver</button>
                        <button onclick="updateStatus('${order.order_id}','Cancelled')">Cancel</button>
                    </p>

                    <p>
                        <strong>Created:</strong>
                        ${formatDate(order.created_at)}
                    </p>

                </div>
            `;
        });

    } catch (error) {
        console.error(error);

        container.innerHTML = `
            <p style="color:red;">
                Failed to load orders.
            </p>
        `;
    }
}

async function updateStatus(orderId, status){

    await fetch(`/api/orders/${orderId}/status`, {
        method: "PATCH",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            status: status
        })
    });

    async function loadByStatus(status){
    const container = document.getElementById("orders");

    try{
        const response = await fetch(`/api/orders/status/${status}`);
        const orders = await response.json();


        if(orders.length === 0){
            container.innerHTML = `<p>No ${status} orders found.</p>`;
            return;
        }

        container.innerHTML = "";

        orders.forEach(order => {
            container.innerHTML += `
            <div class="admin-order">
                <h3>Order #${order.order_id}</h3>

                <p><strong>Customer:</strong> ${order.customer_name}</p>
                <p><strong>Phone:</strong> ${order.phone}</p>
                <p><strong>District:</strong> ${order.district}</p>
                <p><strong>Address:</strong> ${order.address}</p>

                <p><strong>Payment Method:</strong> ${order.payment_method || "Cash on Delivery"}</p>
                <p><strong>bKash Number:</strong> ${order.payment_number || "-"}</p>
                <p><strong>Transaction ID:</strong> ${order.transaction_id || "-"}</p>

                <p><strong>Total:</strong> ৳ ${Number(order.total).toLocaleString()}</p>

                <p>
                    <strong>Status:</strong>
                    <span class="status status-${order.status.toLowerCase()}">${order.status}</span>
                </p>

                <p><strong>Date:</strong> ${formatDate(order.created_at)}</p>
            </div>`;
        });

    }catch(e){
        container.innerHTML = "Failed loading orders";
    }
}

function formatDate(date){
    const d = new Date(date);
    return String(d.getDate()).padStart(2,"0") + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    d.getFullYear() + " | " +
    d.toLocaleTimeString("en-US", {
        hour:"2-digit",
        minute:"2-digit"
    });
}

loadOrders();
}

loadOrders();
</script>

</body>
</html>
