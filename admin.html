<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef8ff;
            color: #1e293b;
        }

        header {
            position:relative;
            display:flex;
            align-items:center;
            justify-content:flex-start;
            padding-right:80px;
            background: linear-gradient(135deg,#38bdf8,#0ea5e9);
            color: #ffffff;
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #bae6fd;
            box-shadow: 0 8px 25px rgba(14,165,233,.25);
        }

        header h1 {
            margin: 0;
        }

        .admin {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .admin-order {
            color:#111827;
            background: #f8fafc;
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 20px rgba(14,165,233,.12);
        }

        .admin-order h3 {
            margin-top: 0;
        }

        .status {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            background: #222;
            color: #fff;
            border: 1px solid #e2e8f0;
        }

        .status-delivered {
            background: #0f5132;
            color: #75ffb0;
        }

        .status-cancelled {
            background: #5a1111;
            color: #ff8a8a;
        }

        .status-confirmed {
            background: #102a56;
            color: #8fc7ff;
        }

        .status-shipped {
            background: #3b245c;
            color: #d7a8ff;
        }

        .status-pending {
            background: #5c4800;
            color: #ffe477;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }
    
.menu-bar{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    padding:20px;
    background:#0b0b0b;
    border-bottom:1px solid #d4af37;
}

.menu-bar button{
    padding:12px 20px;
    border-radius:14px;
    border:none;
    background:#0ea5e9;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 5px 15px rgba(14,165,233,.25);
}

.menu-bar button:hover{
    background:#0284c7;
    color:white;
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(14,165,233,.35);
}


.summary-cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:10px;
}

.card{
    min-width:120px;
    padding:12px 15px;
    text-align:center;
    border-radius:14px;
    color:#1e293b;
    background:#ffffff;
    border:1px solid #e0f2fe;
    color:#1e293b;
    font-weight:700;
    border-radius:18px;
    padding:12px 15px;
    min-height:80px;
    box-shadow:0 6px 18px rgba(14,165,233,.12);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 35px rgba(14,165,233,.2);
}

.card span{
    display:block;
    font-size:22px;
    margin-top:5px;
    color:#0284c7;
}

.card.pending span{
    color:#ffe477;
}

.card.confirmed span{
    color:#8fc7ff;
}

.card.shipped span{
    color:#d7a8ff;
}

.card.delivered span{
    color:#75ffb0;
}

.card.cancelled span{
    color:#ff8a8a;
}


.menu-toggle{
    position:absolute;
    right:15px;
    top:15px;
    background:linear-gradient(145deg,#ffffff,#dbeafe);
    border:none;
    border-radius:14px;
    font-size:30px;
    line-height:1;
    width:48px;
    height:48px;
    cursor:pointer;
    color:#0284c7;
    font-weight:bold;
    box-shadow:0 10px 20px rgba(14,165,233,.35),
               inset 0 2px 5px rgba(255,255,255,.8);
    transform:translateZ(0);
    transition:.3s;
}

.menu-toggle:hover{
    transform:scale(1.08);
    box-shadow:0 12px 25px rgba(14,165,233,.45);
}

.menu-bar{
    display:none;
    position:absolute;
    right:20px;
    top:65px;
    background:#ffffff;
    padding:15px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    z-index:10;
}

.menu-bar.active{
    display:flex;
    flex-direction:column;
    gap:10px;
}

</style>
</head>

<body>

<header>
    <h1>𝐀𝐝𝐦𝐢𝐧</h1>

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
</header>

<nav class="menu-bar" id="adminMenu">
    <button onclick="loadOrders()">🏠 Dashboard</button>
    <button onclick="loadByStatus('Pending')">⏳ Pending</button>
    <button onclick="loadByStatus('Confirmed')">✅ Confirmed</button>
    <button onclick="loadByStatus('Shipped')">📦 Shipped</button>
    <button onclick="loadByStatus('Delivered')">🚚 Delivered</button>
    <button onclick="loadByStatus('Cancelled')">❌ Cancelled</button>
</nav>

<div class="summary-cards">
    <div class="card">📦 Total <span id="totalCount">0</span></div>
    <div class="card pending">⏳ Pending <span id="pendingCount">0</span></div>
    <div class="card confirmed">✅ Confirmed <span id="confirmedCount">0</span></div>
    <div class="card shipped">📦 Shipped <span id="shippedCount">0</span></div>
    <div class="card delivered">🚚 Delivered <span id="deliveredCount">0</span></div>
    <div class="card cancelled">❌ Cancelled <span id="cancelledCount">0</span></div>
</div>

<section class="admin">
    <h2>Order List</h2>

    <div id="orders">
        <div class="loading">Loading orders...</div>
    </div>
</section>

<script>

async function loadSummary(){
    try{
        const response = await fetch("/api/orders");
        const orders = await response.json();

        document.getElementById("totalCount").innerText = orders.length;

        document.getElementById("pendingCount").innerText =
            orders.filter(o => o.status === "Pending").length;

        document.getElementById("confirmedCount").innerText =
            orders.filter(o => o.status === "Confirmed").length;

        document.getElementById("shippedCount").innerText =
            orders.filter(o => o.status === "Shipped").length;

        document.getElementById("deliveredCount").innerText =
            orders.filter(o => o.status === "Delivered").length;

        document.getElementById("cancelledCount").innerText =
            orders.filter(o => o.status === "Cancelled").length;

    }catch(e){
        console.log("Summary loading failed");
    }
}

async function loadOrders() {
    const container = document.getElementById("orders");

    try {
        const response = await fetch("/api/orders");

        if (!response.ok) {
            throw new Error("Failed to load orders");
        }

        let orders = await response.json();


        if (orders.length === 0) {
            container.innerHTML = "<p>No orders yet.</p>";
            return;
        }

        container.innerHTML = "";

        orders.forEach(order => {
            container.innerHTML += `
                <div class="admin-order">

                    <h3>Order #${order.order_id}</h3>

                    <p>
                        <strong>Customer:</strong>
                        ${order.customer_name}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${order.phone}
                    </p>

                    <p>
                        <strong>District:</strong>
                        ${order.district}
                    </p>

                    <p>
                        <strong>Address:</strong>
                        ${order.address}
                    </p>

                    <p>
                        <strong>Delivery:</strong>
                        ${order.delivery_type === "inside"
                            ? "Inside Sylhet"
                            : "Outside Sylhet"}
                    </p>

                    <p>
                        <strong>Subtotal:</strong>
                        ৳ ${Number(order.subtotal).toLocaleString()}
                    </p>

                    <p>
                        <strong>Delivery Charge:</strong>
                        ৳ ${Number(order.delivery_charge).toLocaleString()}
                    </p>

                    <p>
                        <strong>Total:</strong>
                        ৳ ${Number(order.total).toLocaleString()}
                    </p>

                    <p>
                        <strong>Payment Method:</strong>
                        ${order.payment_method || "Cash on Delivery"}
                    </p>

                    <p>
                        <strong>bKash Number:</strong>
                        ${order.payment_number || "-"}
                    </p>

                    <p>
                        <strong>Transaction ID:</strong>
                        ${order.transaction_id || "-"}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        <span class="status status-${order.status.toLowerCase()}">${order.status}</span>

                        <br><br>
                        <button onclick="updateStatus('${order.order_id}','Confirmed')">Confirm</button>
                        <button onclick="updateStatus('${order.order_id}','Shipped')">Ship</button>
                        <button onclick="updateStatus('${order.order_id}','Delivered')">Deliver</button>
                        <button onclick="updateStatus('${order.order_id}','Cancelled')">Cancel</button>
                    </p>

                    <p>
                        <strong>Created:</strong>
                        ${formatDate(order.created_at)}
                    </p>

                </div>
            `;
        });

    } catch (error) {
        console.error(error);

        container.innerHTML = `
            <p style="color:red;">
                Failed to load orders.
            </p>
        `;
    }
}

async function updateStatus(orderId, status){

    await fetch(`/api/orders/${orderId}/status`, {
        method: "PATCH",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            status: status
        })
    });

    await loadSummary();
    await loadOrders();
}

    async function loadByStatus(status){
    const container = document.getElementById("orders");

    try{
        const response = await fetch(`/api/orders/status/${status}`);
        const orders = await response.json();


        if(orders.length === 0){
            container.innerHTML = `<p>No ${status} orders found.</p>`;
            return;
        }

        container.innerHTML = "";

        orders.forEach(order => {
            container.innerHTML += `
            <div class="admin-order">
                <h3>Order #${order.order_id}</h3>

                <p><strong>Customer:</strong> ${order.customer_name}</p>
                <p><strong>Phone:</strong> ${order.phone}</p>
                <p><strong>District:</strong> ${order.district}</p>
                <p><strong>Address:</strong> ${order.address}</p>

                <p><strong>Payment Method:</strong> ${order.payment_method || "Cash on Delivery"}</p>
                <p><strong>bKash Number:</strong> ${order.payment_number || "-"}</p>
                <p><strong>Transaction ID:</strong> ${order.transaction_id || "-"}</p>

                <p><strong>🛒 Product:</strong><br>
                ${
                    order.items ? JSON.parse(order.items).map(item =>
                    `${item.name} | 🎨 ${item.colour || "-"} | 📏 ${item.size || "-"}`
                    ).join("<br>") : "-"
                }
                </p>

                <p><strong>Total:</strong> ৳ ${Number(order.total).toLocaleString()}</p>

                <p>
                    <strong>Status:</strong>
                    <span class="status status-${order.status.toLowerCase()}">${order.status}</span>
                </p>

                <p><strong>Date:</strong> ${formatDate(order.created_at)}</p>
            </div>`;
        });

    }catch(e){
        container.innerHTML = "Failed loading orders";
    }
}

function formatDate(date){
    const d = new Date(date);
    return String(d.getDate()).padStart(2,"0") + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    d.getFullYear() + " | " +
    d.toLocaleTimeString("en-US", {
        hour:"2-digit",
        minute:"2-digit"
    });
}

loadSummary();
loadOrders();
function toggleMenu(){
    document.getElementById("adminMenu")
    .classList.toggle("active");
}

</script>

</body>
</html>
